services:
  wud:
    image: fmartinou/whats-up-docker:latest
    container_name: wud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
    environment:
      - WUD_WATCHER_LOCAL_CRON=0 * * * *
      # Configuration Discord
      - WUD_TRIGGER_DISCORD=true
      - WUD_TRIGGER_DISCORD_WEBHOOK=https://discordapp.com/api/webhooks/1523618644427407471/U5Gz4bUTdBxvn3w2AU9dbp3GO3_D4WrGN6xkZH0YOv7WEAW0gWlEptbRQD_LlBsm6UFg
      - WUD_TRIGGER_DISCORD_JOBS=dockerimage:new,container:update.success,container:update.failure

  database:
    image: mysql:8.0
    container_name: mysql_backend
    environment:
      MYSQL_ROOT_PASSWORD: root   
      MYSQL_DATABASE: cesizenV2      
      # (Rappel : j'ai enlevé MYSQL_USER et MYSQL_PASSWORD ici comme vu avant)
    ports:
      - "3306:3306"
    volumes:
      - "./SQL Init.sql:/docker-entrypoint-initdb.d/01-init.sql"
      - "mysql_data:/var/lib/mysql"
    # NOUVEAU : On apprend à Docker à vérifier si MySQL est prêt
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-auth:
    image: cesizenapi:latest
    build:
      context: ./CesizenBase
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/cesizenV2?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
    labels:
      - wud.watch=true
      - wud.trigger.docker-compose.backend-auth=true
      - wud.trigger.docker-compose.backend-auth.file=./compose.yaml

# ... (le reste de ton fichier pour le front reste identique)

  # --- TON FRONT-END IONIC ---
  frontend-ionic:
    image: cesizenfront:latest
    build:
      context: ./CesiZenApp
      dockerfile: Dockerfile
    ports:
      - "8100:80"
    depends_on:
      - backend-auth
    labels:
      - wud.watch=true
      - wud.trigger.docker-compose.frontend-ionic=true
      - wud.trigger.docker-compose.frontend-ionic.file=./compose.yaml

  # Service pour lancer un linter (frontend)
  linter:
    image: node:18
    container_name: cesizen_linter
    working_dir: /workspace/CesiZenApp
    volumes:
      - ./CesiZenApp:/workspace/CesiZenApp
      - npm_cache:/root/.npm
    command: /bin/sh -c "if [ -f package.json ]; then npm ci && npm run lint; else echo 'No frontend package.json, skipping lint'; fi"
    restart: 'no'

  # Service pour exécuter les tests unitaires (backend Maven)
  unit-tests:
    image: maven:3.9.5-eclipse-temurin-17
    container_name: cesizen_unit_tests
    working_dir: /workspace/CesizenBase
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/cesizenV2?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    volumes:
      - ./CesizenBase:/workspace/CesizenBase
      - maven_repo:/root/.m2
    command: mvn -f /workspace/CesizenBase/pom.xml test
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'

volumes:
  mysql_data:
  maven_repo:
  npm_cache: