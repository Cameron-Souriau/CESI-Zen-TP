name: CI/CD Deployment

on:
  push:
    branches: [ master, main ]

jobs:
  test-and-lint:
    name: Tests & Linting
    runs-on: self-hosted
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Démarrer la base de données et attendre qu'elle soit prête
        run: |
          cd $GITHUB_WORKSPACE
          docker compose up -d database
          # Attendre que MySQL soit prêt (healthcheck)
          for i in {1..30}; do
            if docker compose exec -T database mysqladmin ping -h localhost -u root -proot &> /dev/null; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 1
          done

      - name: Lancer les tests unitaires (Backend Maven)
        run: |
          cd $GITHUB_WORKSPACE
          docker compose run --rm unit-tests

      - name: Lancer le linter (Frontend)
        run: |
          cd $GITHUB_WORKSPACE
          docker compose run --rm linter
        continue-on-error: true  # Le linter ne doit pas bloquer le déploiement

      - name: Arrêter et nettoyer la base de données
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          docker compose down

  deploy:
    name: Deploy to Production
    needs: test-and-lint
    runs-on: self-hosted
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Mettre à jour et lancer la stack Docker
        run: |
          cd $GITHUB_WORKSPACE
          git pull origin master
          docker compose down
          docker compose rm -f
          docker compose up -d --build --remove-orphans

      - name: Vérifier la santé de l'application
        run: |
          sleep 10
          docker compose ps
          docker compose logs --tail 50