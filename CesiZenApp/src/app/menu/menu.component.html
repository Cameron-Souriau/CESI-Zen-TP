<ion-app>
  <ion-split-pane contentId="main-content" when="lg">

    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Cesizen</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list lines="none">
          <ion-list-header>Navigation</ion-list-header>

          <ion-menu-toggle auto-hide="false">
            <ion-item [button]="true" routerLink="/home" routerDirection="root">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Accueil</ion-label>
            </ion-item>

            <ion-item [button]="true" routerLink="/admin" routerDirection="root">
              <ion-icon slot="start" name="settings-outline"></ion-icon>
              <ion-label>Administration</ion-label>
            </ion-item>

            <ion-item [button]="true" routerLink="/profile" routerDirection="root">
              <ion-icon slot="start" name="person-outline"></ion-icon>
              <ion-label>Mon Compte</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <div class="ion-page" id="main-content">
      <ion-router-outlet></ion-router-outlet>
    </div>

  </ion-split-pane>
</ion-app>
