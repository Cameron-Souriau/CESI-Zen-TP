<ion-app>
  <ion-split-pane contentId="main-content" when="lg" [disabled]="menuDisabled">

    <ion-menu contentId="main-content" type="overlay" [disabled]="menuDisabled">

      <ion-header class="ion-no-border">
        <ion-toolbar color="primary">
          <ion-title>Cesizen</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-menu-toggle auto-hide="false">


        <div class="menu-header-image ion-padding ion-text-center">
          <ion-avatar style="margin: 0 auto; width: 64px; height: 64px;">
            <img src="https://ionicframework.com/docs/img/demos/avatar.svg" />
          </ion-avatar>
          <h3 class="ion-margin-top">Julie Dupont</h3>
        </div>

        <ion-list lines="none">
          <ion-menu-toggle auto-hide="false">
            <ion-item [button]="true" routerLink="/" routerLinkActive="selected">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Accueil</ion-label>
            </ion-item>

            <ion-item [button]="true" routerLink="/gestionInformation" routerLinkActive="selected">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Informations utiles</ion-label>
            </ion-item>

            <ion-item [button]="true" routerLink="/gestionModule" routerLinkActive="selected">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Module de relaxation</ion-label>
            </ion-item>

            <ion-item [button]="true" routerLink="/administration" routerLinkActive="selected">
              <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
              <ion-label>Administration</ion-label>
            </ion-item>

            <ion-item [button]="true" routerLink="/compte" routerLinkActive="selected">
              <ion-icon slot="start" name="person-circle-outline"></ion-icon>
              <ion-label>Mon Compte</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-list lines="none" class="logout-list">
          <ion-item [button]="true" routerLink="/connection" color="primary" [detail]="false">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Connexion</ion-label>
          </ion-item>
          <ion-item [button]="true" routerLink="/login" color="danger" [detail]="false">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Déconnexion</ion-label>
          </ion-item>
        </ion-list>
        </ion-menu-toggle>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>

  </ion-split-pane>
</ion-app>
